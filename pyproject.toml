[build-system]
requires = ["hatchling", "hatch-vcs", "setuptools>=61,<67"]
build-backend = "hatchling.build"


[project]
name = "srx-caproto-iocs"
authors = [
  { name = "Brookhaven National Laboratory", email = "mrakitin@bnl.gov" },
]
description = "Caproto IOCs for the NSLS-II SRX beamline"
readme = "README.md"
license.file = "LICENSE"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "caproto",
  "h5py",
  "numpy",
  "ophyd",
  "pillow",
  "pyepics",  # does not work with 'setuptools' version higher than v66.1.1
  "scikit-image[data]",
]

[project.optional-dependencies]
test = [
  "pytest >=6",
  "pytest-cov >=3",
]
dev = [
  "ipython",
  "nexpy",
  "pre-commit",
  "pylint",
  "pytest >=6",
  "pytest-cov >=3",
]
docs = [
  "sphinx>=7.0",
  "myst_parser>=0.13",
  "sphinx_copybutton",
  "sphinx_autodoc_typehints",
  "furo>=2023.08.17",
]

[project.urls]
Homepage = "https://github.com/NSLS-II-SRX/srx-caproto-iocs"
"Bug Tracker" = "https://github.com/NSLS-II-SRX/srx-caproto-iocs/issues"
Discussions = "https://github.com/NSLS-II-SRX/srx-caproto-iocs/discussions"
Changelog = "https://github.com/NSLS-II-SRX/srx-caproto-iocs/releases"


[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/srx_caproto_iocs/_version.py"

[tool.hatch.envs.default]
features = ["test"]
scripts.test = "pytest {args}"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
  "error",
]
log_cli_level = "INFO"
testpaths = [
  "tests",
]
markers = [
    "hardware: marks tests as requiring the hardware IOC to be available/running (deselect with '-m \"not hardware\"')",
    "tiled: marks tests as requiring tiled",
    "cloud_friendly: marks tests to be able to execute in the CI in the cloud",
    "needs_epics_core: marks tests as requiring epics-core executables such as caget, caput, etc."
]

[tool.coverage]
run.source = ["srx_caproto_iocs"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "srx_caproto_iocs.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true


[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = [
  "B",        # flake8-bugbear
  "I",        # isort
  # "ARG",      # flake8-unused-arguments
  "C4",       # flake8-comprehensions
  "EM",       # flake8-errmsg
  "ICN",      # flake8-import-conventions
  "G",        # flake8-logging-format
  "PGH",      # pygrep-hooks
  "PIE",      # flake8-pie
  "PL",       # pylint
  "PT",       # flake8-pytest-style
  "PTH",      # flake8-use-pathlib
  "RET",      # flake8-return
  # "RUF",      # Ruff-specific
  "SIM",      # flake8-simplify
  # "T20",      # flake8-print
  "UP",       # pyupgrade
  "YTT",      # flake8-2020
  "EXE",      # flake8-executable
  "NPY",      # NumPy specific rules
  "PD",       # pandas-vet
]
ignore = [
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
  "ISC001",   # Conflicts with formatter
]
isort.required-imports = ["from __future__ import annotations"]
# Uncomment if using a _compat.typing backport
# typing-modules = ["srx_caproto_iocs._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"noxfile.py" = ["T20"]


[tool.pylint]
py-version = "3.8"
ignore-paths = [".*/_version.py"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "wrong-import-position",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.feature.dev.pypi-dependencies]
srx-caproto-iocs = { path = ".", editable = true }

[tool.pixi.feature.test.pypi-dependencies]
srx-caproto-iocs = { path = ".", editable = true, extras = ["test"] }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
test = { cmd = "pytest", description = "Run the test suite" }

[tool.pixi.dependencies]
pip = ">=26.1.1,<27"

[tool.pixi.feature.dev.dependencies]
pre-commit = ">=4.6.0,<5"
pytest = ">=9.0.3,<10"
python = "3.12.*"
nexpy = ">=2.0.1,<3"
epics-base = ">=7.0.9.0,<8"
